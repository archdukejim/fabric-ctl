# Tool configuration only: fabric is not packaged as a Python project (its package is the .deb, manual 1.3.1).

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# pycodestyle errors and warnings, pyflakes (decision 2.1.1.15, manual 3.1.2)
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# the suites' check messages and expected outputs are long on purpose: one line per check reads best
"tests/**" = ["E501"]
# the lab's answer-file generators hold the installers' own lines (autounattend XML, sshd and PowerShell text) inside
# strings; wrapping them would change the media the installers read (manual 3.1.5.3)
"scripts/lab/seeds/**" = ["E501"]
