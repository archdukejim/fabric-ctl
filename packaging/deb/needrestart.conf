# fabricctl (decision 2.1.2.28, manual 1.3.2.3.5): needrestart never restarts setup's own unit while it works.
# unattended-upgrades runs needrestart in its automatic mode; a restart there cut a fresh install short (2.3.1.55).
# Every other service is restarted as before. Shipped by the fabricctl package: dpkg owns it, `apt purge` removes it.
$nrconf{override_rc}->{qr(^fabric-setup\.service$)} = 0;
