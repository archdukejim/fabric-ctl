# The validated container images fabric runs (manual 1.14.2).
#
# Every image is pinned by its multi-arch index digest (amd64 + arm64): an
# upstream push never changes what a host runs. vars.yaml.j2 takes its
# image_* defaults from here, and `fabricctl images status/update` compares
# each host against this list. Later a watch-images workflow (planned,
# not in .github/workflows yet) proposes changes to this file after the
# regression suites pass.
#
#   track:  which new upstream tags may become candidates (a tag pattern
#           within one major/minor, or a floating tag whose digest moves)
#   policy: auto | manual (manual: frozen, the watcher only reports)
images:
  nginx:
    var: image_nginx
    repo: nginx
    tag: "1.30.5"
    digest: sha256:b972f831f200b19ef0767938224f9711e74cd783718738cd7405d5cabf75c442
    track: "1.30.*"                  # the stable branch
    policy: auto
  stepca:                            # base of fabric/stepca:local
    var: image_stepca
    repo: smallstep/step-ca
    tag: "0.30.2"
    digest: sha256:a2b17872915c193259b75a5474c398326f41bd199f0842093e52cf4182bc8270
    track: "0.30.*"
    policy: auto
  keycloak:                          # base of fabric/keycloak:local
    var: image_keycloak
    repo: keycloak/keycloak
    tag: "26.7.4"
    digest: sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
    track: "26.*"
    policy: auto
  postgres:
    var: image_postgres
    repo: postgres
    tag: "18.6"
    digest: sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    track: "18.*"                    # a new major needs a data upgrade: never automatic
    policy: auto
  openbao:
    var: image_openbao
    repo: openbao/openbao
    tag: "2.7.0"
    digest: sha256:71156a1c6623a5fa3f5e61b0c6a8ead0faf0df29a778339188443551995d1315
    track: "2.7.*"
    policy: auto
  fluentbit:                         # optional: log forwarding (install_fluentbit)
    var: image_fluentbit
    repo: fluent/fluent-bit
    tag: "5.1.2"
    digest: sha256:d792375ca8e53be72fc25716c28f291f32c6fc6f4f31d12d0d14bc78cefe9226
    track: "5.1.*"
    policy: auto
  adguard:                           # the DNS filter's list matcher behind the resolver (manual 1.12.3, 2.1.12.6)
    var: image_adguard
    repo: adguard/adguardhome
    tag: "v0.107.79"
    digest: sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
    track: "v0.107.*"
    policy: auto
  cosign:                            # verifies the signatures of fabric's published images (2.1.14.6, 2.1.14.11)
    var: image_cosign
    repo: ghcr.io/sigstore/cosign/cosign
    tag: "v3.0.6"
    digest: sha256:de9c65609e6bde17e6b48de485ee788407c9502fa08b8f4459f595b21f56cd00
    track: "v3.*"
    policy: manual                   # a verifier changes only by a reviewed decision
  debian:                            # base of fabric/bind9:local, fabric/web:local,
                                     # fabric/kea:local and fabric/freeradius:local
    var: image_debian
    repo: debian
    tag: trixie-slim
    digest: sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a
    track: trixie-slim
    policy: auto

# fabric's own images, built and smoke tested in CI, signed and published (manual 1.14.3, 3.14.1; 2.1.1.21).
# An empty digest: not published yet, and hosts build that image themselves; it needs `pending` (why),
# which pin_published drops when it pins the image (the images suite refuses an unexplained gap). `ids` are the service
# account ids baked into the published image (the Dockerfile's defaults): a host whose
# service_users.<account> differ builds that image itself (2.1.14.5). `source` is the hash of what the published image was
# built from (scripts/images/source_hash.py): when its sources change, the image is unpinned and marked `pending` until it
# is published again; the images suite refuses a stale pin (2.1.14.13).
published:
  registry: ghcr.io/archdukejim/open-fabric
  # who may have signed them: this repository's images workflow, from main, an rc/ branch or a v tag (2.1.14.9)
  signer: ^https://github\.com/archdukejim/open-fabric/\.github/workflows/images\.yml@refs/(heads/main|heads/rc/.+|tags/v.+)$
  issuer: https://token.actions.githubusercontent.com
  images:
    bind9:      {var: image_fabric_bind9, tag: "0.7.0-rc.126", digest: "sha256:5d0e4f4663a27c8b1b6ee22923dd3aff7623e395f8c9acabf324eee21c1b15be", source: "sha256:cfad6ca373441787e72ba1b7bb837f0f0d3f364274f2cfb4b72fd9cb3b34255a", account: bind, ids: "600:600"}
    freeradius: {var: image_fabric_freeradius, tag: "0.7.0-rc.126", digest: "sha256:c070f151a070dbbf0c8385e3b47c20a5b7a70276ce0558a0a1eb20789420c2be", source: "sha256:d9dd93ddf40797b22c885f96e1663b65d7c99eee4898a90298ebe58e36969cbf", account: freeradius, ids: "610:610"}
    kea:        {var: image_fabric_kea, tag: "0.7.0-rc.126", digest: "sha256:d109296561337afa91bc5c1cd7ea4e1dd51daf3cd7e31c950437e52f36f916fc", source: "sha256:78b1e088e11a51e67e1a04de84c174d7acefafafe7e080988c971c6e1bcb592a", account: kea, ids: "609:609"}
    keycloak:   {var: image_fabric_keycloak, tag: "0.7.0-rc.126", digest: "sha256:55532b50a895d7a8bcfbb514df1b93743dff3c4c0139975197e495af69d59cde", source: "sha256:959fee075a7826341979c0d03be1041f3030429677424512af8d9af92a223f2c"}
    samba:      {var: image_fabric_samba, tag: "0.7.0-rc.126", digest: "sha256:467b32ebaec2a79116b5ec9a42327ae2c87afcc36261ff8f40a20043a2275889", source: "sha256:bc9d2e8b51a78105d939031954ae237c63a1e5ca8b762f8545c8bbcf2e239af0", groups: "BIND_GID=600,RADIUS_GID=610"}
    stepca:     {var: image_fabric_stepca, tag: "0.7.0-rc.126", digest: "sha256:ee28f6bed484550b280a9c423d07b6cb3540c440cc1ebab989f4e2729b6ed96d", source: "sha256:c1cfad746580c5a98afc2a1268448efbdb2b610024d2e5adeda45db85175f20e"}
    webui:      {var: image_fabric_webui, tag: "0.7.0-rc.126", digest: "sha256:41d25985cf42a47e55db73cb6755b19208884c87f50afc03042fa9129206bd36", source: "sha256:1d1aff2634807d6b4a53525cd8cdb5ced89330fbd221d6e723574340b4630c81", account: webui, ids: "606:606"}

# Packages installed into fabric's own images from an upstream's signed apt
# repository (not Debian's): the exact version and the signing key's
# fingerprint are pinned, so a rebuild gets exactly this (design 2.1.1.5).
packages:
  kea:                               # Kea DHCP 3.0 LTS (ISC); Debian trixie ships only 2.6
    version: "3.0.4-isc20260728182757"
    repo: https://dl.cloudsmith.io/public/isc/kea-3-0/deb/debian
    suite: trixie
    key_url: https://dl.cloudsmith.io/public/isc/kea-3-0/gpg.key
    key_fingerprint: 9DA570BB192211885E4EB280B16C44CD45514C3C
    track: "3.0.*"
    policy: auto
